version: '3.8'
services:
  web:
    build: storage/
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=project
      - POSTGRES_USER=VishupHell
      - POSTGRES_PASSWORD=VishupHell
volumes:
  postgres_data: